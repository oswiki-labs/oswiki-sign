name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Staged publishing needs npm >= 11.15.0
        run: npm install -g npm@11.20.0
      - name: Tag matches package.json and is on main
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pack
      - run: npm run test:bundle
      - name: Stage the release on npm
        run: npm stage publish --provenance --access public --ignore-scripts
      - name: Ask the maintainer to approve
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          {
            echo "## $NAME@$VERSION is staged, not live yet"
            echo
            echo "A maintainer must approve it with 2FA before it is published:"
            echo
            echo "- On https://www.npmjs.com, open the **Staged Packages** tab, review $NAME@$VERSION and click **Approve**, or"
            echo "- \`npm stage list $NAME\` to find the stage id, then \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
